name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (content of the private key file + its password).
          # Set once in repo Settings → Secrets and variables → Actions:
          #   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # See docs/自动更新与发布.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "KeyPulse v__VERSION__"
          releaseBody: |
            自动构建产物：NSIS 安装包 + 自动更新签名（latest.json 与 .sig）。

            更新统一走 NSIS 用户级静默安装（免管理员权限）。老用户下次启动（或托盘“检查更新”）会自动提示升级。

            **首次运行提示**：安装包未做代码签名，浏览器手动下载后首次运行如遇 Windows SmartScreen 蓝色提示，属未签名程序的正常现象——点「更多信息」→「仍要运行」即可；应用内自动更新不触发任何提示。
            **完整性校验**：附件 `checksums-sha256.txt` 内含安装包的 SHA-256，可用 `certutil -hashfile 文件名 SHA256`（Windows）或 `sha256sum`（macOS/Linux）比对。
          releaseDraft: false
          prerelease: false

      - name: Attach SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $files = Get-ChildItem "$dir/*-setup.exe"
          if (-not $files) { throw "no setup.exe found in $dir" }
          if (Test-Path "checksums-sha256.txt") { Remove-Item "checksums-sha256.txt" }
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Add-Content -Path "checksums-sha256.txt" -Value "$hash  $($_.Name)"
          }
          Get-Content "checksums-sha256.txt"
          gh release upload "${{ github.ref_name }}" "checksums-sha256.txt" --clobber
